[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depsentinel"
version = "0.1.0"
description = "SBOM 취약점 우선순위 MCP 서버 — 보안 사각지대를 위한 대화형 공급망 점검"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "누요" }]
keywords = ["mcp", "sbom", "security", "vulnerability", "supply-chain", "osv"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "cvss>=3.0",
]

[project.scripts]
depsentinel = "depsentinel.server:main"
depsentinel-scan = "depsentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["depsentinel"]
